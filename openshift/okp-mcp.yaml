---
kind: ServiceAccount
apiVersion: v1
metadata:
  name: okp-mcp
  labels:
    app: okp-mcp
    service: rhel-lightspeed
    template: okp-mcp

---
kind: Deployment
apiVersion: apps/v1

metadata:
  name: okp-mcp
  labels:
    app: okp-mcp
    service: rhel-lightspeed
    template: okp-mcp

spec:
  replicas: 1

  selector:
    matchLabels:
      app: okp-mcp

  strategy:
    type: Recreate

  template:
    metadata:
      labels:
        app: okp-mcp
        service: rhel-lightspeed

    spec:
      containers:
        - name: okp-mcp
          image: quay.io/redhat-services-prod/rhel-lightspeed-tenant/rhel-knowledge-bridge:b7f3a46

          env:
            - name: MCP_TRANSPORT
              value: streamable-http

            - name: MCP_PORT
              value: '8000'

            - name: MCP_LOG_LEVEL
              value: INFO

            - name: MCP_SOLR_URL
              value: http://redhat-okp:8983

            - name: MCP_GLITCHTIP_DSN
              valueFrom:
                secretKeyRef:
                  key: dsn
                  name: okp-mcp-glitchtip
                  optional: true

          livenessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 8000

          ports:
            - containerPort: 8000
              protocol: TCP

          readinessProbe:
            failureThreshold: 3
            initialDelaySeconds: 5
            periodSeconds: 10
            tcpSocket:
              port: 8000

          resources:
            limits:
              cpu: '1'
              memory: 512Mi

            requests:
              cpu: 250m
              memory: 256Mi

      serviceAccountName: okp-mcp

---
kind: Service
apiVersion: v1

metadata:
  name: okp-mcp
  labels:
    app: okp-mcp
    service: rhel-lightspeed
    template: okp-mcp

spec:
  ports:
    - port: 8000
      protocol: TCP
      targetPort: 8000

  selector:
    app: okp-mcp

  sessionAffinity: ClientIP
