# {{ ansible_managed }}
{#
See https://github.com/lightspeed-core/lightspeed-stack/tree/release/0.6/examples
for example configs
#}
name: lightspeed-stack

service:
  host: "{{ ls_host }}"
  port: {{ ls_port }}
  root_path: /api/lightspeed
  auth_enabled: {{ (ls_auth_enabled | bool) | ternary('true', 'false') }}
  workers: {{ ls_workers }}

{% if ls_auth_enabled | bool %}
authentication:
  module: {{ ls_auth_module }}
  skip_for_health_probes: true
  skip_for_metrics: true
{% if ls_auth_module == 'api-key-token' %}
  api_key_config:
    # LCORE replace_env_vars resolves ${env.*} from the process environment.
    api_key: "${env.API_KEY}"
{% elif ls_auth_module == 'rh-identity' %}
  rh_identity_config:
    required_entitlements:
{% for ent in ls_rh_identity_entitlements %}
      - {{ ent }}
{% endfor %}
{% endif %}
{% endif %}

authorization:
  access_rules:
    - role: "*"
      actions:
        - rlsapi_v1_infer
        - responses
        - get_metrics
        - info

conversation_cache:
  type: noop

inference:
  default_provider: {{ rhel_cla_provider }}
  default_model: {{ _ls_provider_config.default_model }}

customization:
  system_prompt_path: /app-root/system_prompt.txt
  disable_query_system_prompt: true
  disable_shield_ids_override: true

mcp_servers:
  - name: rhel-knowledge-bridge
    provider_id: model-context-protocol
    url: http://{{ rkb_name }}:{{ rkb_port }}/mcp

deployment_environment: {{ ls_deployment_environment }}

splunk:
  enabled: false

user_data_collection:
  feedback_enabled: false
  transcripts_enabled: false

{% if ls_use_postgres | bool %}
quota_handlers:
  postgres:
    host: ${env.POSTGRES_HOST}
    port: "${env.POSTGRES_PORT}"
    db: ${env.POSTGRES_DB}
    user: ${env.POSTGRES_USER}
    password: ${env.POSTGRES_PASSWORD}
{% endif %}

llama_stack:
  use_as_library_client: true
  library_client_config_path: /app-root/llama-stack.yml
