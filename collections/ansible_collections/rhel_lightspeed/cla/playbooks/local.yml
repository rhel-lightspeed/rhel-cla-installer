- name: Setup RHEL CLA locally
  hosts: localhost
  become: yes
  gather_facts: no

  vars:
    okp_name: rh-offline-knowledge-portal
    okp_solr_port: 8983

  tasks:
    - import_role:
        name: cla_pod

    - import_role:
        name: okp

    - import_role:
        name: rhel_knowledge_bridge

    - import_role:
        name: lightspeed_stack

