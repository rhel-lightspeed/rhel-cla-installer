- name: Setup RHEL CLA in K8S
  hosts: localhost
  connection: local
  gather_facts: no
  become: no

  vars:
    ansible_python_interpreter: "{{ ansible_playbook_python }}"
    ansible_operator_meta:
      namespace: rhel-cla

    okp_name: rh-offline-knowledge-portal
    okp_solr_port: 8983

  tasks:
    - import_role:
        name: okp
        tasks_from: k8s
      tags: [okp]

    - import_role:
        name: rhel_knowledge_bridge
        tasks_from: k8s
      tags: [rhel_knowledge_bridge]

    - import_role:
        name: lightspeed_stack
        tasks_from: k8s
      tags: [lightspeed_stack]
