- name: Remove RHEL CLA
  hosts: all
  become: yes

  vars:
    okp_name: rh-offline-knowledge-portal
    okp_solr_port: 8983
    state: absent
    cla_state: "{{ state }}"
    okp_state: "{{ state }}"
    ls_state: "{{ state }}"
    rkb_state: "{{ state }}"

  handlers:
    - name: reset-failed
      command: systemctl reset-failed
      changed_when: no
      become: yes
      listen:
        - cleanup

    - name: reload systemd
      systemd:
        daemon_reload: yes
      listen:
        - cleanup

  tasks:
    - import_role:
        name: cla_pod
        tasks_from: remove

    - import_role:
        name: rhel_knowledge_bridge
        tasks_from: remove

    - import_role:
        name: okp
        tasks_from: remove

    - import_role:
        name: lightspeed_stack
        tasks_from: remove
