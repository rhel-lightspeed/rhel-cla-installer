- name: Setup RHEL CLA
  hosts: okp
  become: yes

  vars:
    okp_name: rh-offline-knowledge-portal
    okp_solr_port: 8983

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: yes
      listen:
        - init

  tasks:
    - import_role:
        name: cla_pod

    - import_role:
        name: okp

    - import_role:
        name: rhel_knowledge_bridge

    - import_role:
        name: lightspeed_stack

    - name: Reload systemd
      systemd:
        daemon_reload: yes
      tags:
        - always

    - name: Start the pod
      systemd:
        name: "{{ cla_pod_name }}-pod"
        state: started
      tags:
        - always
