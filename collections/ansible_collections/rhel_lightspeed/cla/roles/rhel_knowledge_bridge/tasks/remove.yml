- name: Stop services
  systemd:
    name: "{{ item }}"
    state: stopped
    enabled: no
  loop:
    - "{{ rkb_name }}-image"
    - "{{ rkb_name }}"
  ignore_errors: yes

- name: Remove unit files
  file:
    path: /etc/containers/systemd/{{ item }}
    state: absent
  loop:
    - "{{ rkb_name }}.image"
    - "{{ rkb_name }}.container"
  notify: reload systemd
