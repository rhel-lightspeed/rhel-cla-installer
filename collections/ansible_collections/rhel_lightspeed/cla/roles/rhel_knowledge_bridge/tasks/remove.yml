- name: Stop service
  systemd:
    name: "{{ rkb_name }}"
    state: stopped
    enabled: no
  ignore_errors: yes
  tags:
    - rkb

- name: Remove unit files
  file:
    path: /etc/containers/systemd/{{ item }}
    state: absent
  loop:
    - "{{ rkb_name }}.image"
    - "{{ rkb_name }}.container"
  notify: cleanup
  tags:
    - rkb

- name: Remove container image
  command:
    cmd: podman rmi {{ rkb_container_image }}
  register: _rkb_rmi
  changed_when: _rkb_rmi.rc == 0
  failed_when: false
  tags:
    - rkb
